<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mening AI Yordamchim</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; }
        
        .chat-container { 
            width: 100%; 
            max-width: 500px; 
            height: 85vh; 
            background: white; 
            display: flex; 
            flex-direction: column; 
            border-radius: 15px; 
            box-shadow: 0 5px 25px rgba(0,0,0,0.1); 
            overflow: hidden;
            margin: 10px;
        }

        .chat-header { 
            background: #007bff; 
            color: white; 
            padding: 20px; 
            text-align: center; 
            font-size: 20px; 
            font-weight: bold; 
        }

        #chatBox { 
            flex: 1; 
            padding: 20px; 
            overflow-y: auto; 
            display: flex; 
            flex-direction: column; 
            gap: 15px; 
            background: #ffffff;
        }

        .message { 
            padding: 12px 18px; 
            border-radius: 20px; 
            max-width: 80%; 
            font-size: 15px; 
            line-height: 1.5;
            word-wrap: break-word;
        }

        .user { 
            background: #007bff; 
            color: white; 
            align-self: flex-end; 
            border-bottom-right-radius: 2px; 
        }

        .ai { 
            background: #e9ecef; 
            color: #333; 
            align-self: flex-start; 
            border-bottom-left-radius: 2px; 
        }

        .input-area { 
            display: flex; 
            padding: 20px; 
            border-top: 1px solid #eee; 
            background: white;
        }

        input { 
            flex: 1; 
            padding: 12px 20px; 
            border: 1px solid #ddd; 
            border-radius: 30px; 
            outline: none; 
            font-size: 15px; 
        }

        button { 
            background: #007bff; 
            color: white; 
            border: none; 
            padding: 0 20px; 
            margin-left: 10px; 
            border-radius: 30px; 
            cursor: pointer; 
            font-weight: bold;
            transition: 0.3s;
        }

        button:hover { background: #0056b3; }

        .loading { color: #888; font-style: italic; font-size: 13px; }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">AI Assistant</div>
    <div id="chatBox">
        <div class="message ai">Salom! Men tayyorman. Savolingizni yozing.</div>
    </div>
    <div class="input-area">
        <input type="text" id="userInput" placeholder="Savol yozing...">
        <button id="sendBtn">Yuborish</button>
    </div>
</div>

<script>
    // Sizning yangi Gemini API kalitingiz
    const API_KEY = "AIzaSyBlsfnAEGCfKjs8PI5F2MTvfwR55Nbj7_k";

    async function chat() {
        const input = document.getElementById('userInput');
        const text = input.value.trim();
        if (!text) return;

        // Foydalanuvchi xabarini qo'shish
        addMessage(text, 'user');
        input.value = "";

        // Yuklanish holatini ko'rsatish
        const load = addMessage("O'ylayapman...", 'ai');
        load.classList.add('loading');

        try {
            // v1 (stable) versiyasidan foydalanamiz
            const response = await fetch(`https://generativelanguage.googleapis.com/v1/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: text }] }]
                })
            });

            const data = await response.json();
            load.remove(); // Yuklanish xabarini o'chirish

            if (data.candidates && data.candidates[0].content.parts[0].text) {
                let reply = data.candidates[0].content.parts[0].text;
                addMessage(reply, 'ai');
            } else if (data.error) {
                console.error("API Xatosi:", data.error);
                addMessage("Xato: " + data.error.message, 'ai');
            } else {
                addMessage("Kechirasiz, javobni shakllantirib bo'lmadi.", 'ai');
            }
        } catch (e) {
            if(load) load.remove();
            addMessage("Xato: Tarmoq bilan muammo yuzaga keldi.", 'ai');
            console.error("Fetch Error:", e);
        }
    }

    function addMessage(t, type) {
        const d = document.createElement('div');
        d.className = `message ${type}`;
        d.innerText = t;
        const b = document.getElementById('chatBox');
        b.appendChild(d);
        b.scrollTop = b.scrollHeight; // Har doim oxirgi xabarga tushish
        return d;
    }

    document.getElementById('sendBtn').onclick = chat;
    document.getElementById('userInput').onkeypress = (e) => { 
        if(e.key === 'Enter') chat(); 
    };
</script>

</body>
</html>
