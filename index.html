<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Assistant</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { background: #e5e7eb; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .chat-wrap { width: 400px; height: 550px; background: white; border-radius: 15px; display: flex; flex-direction: column; box-shadow: 0 10px 25px rgba(0,0,0,0.1); overflow: hidden; }
        .header { background: #10a37f; color: white; padding: 15px; text-align: center; font-weight: bold; }
        #chatBox { flex: 1; padding: 15px; overflow-y: auto; background: #f9fafb; display: flex; flex-direction: column; gap: 10px; }
        .m { padding: 10px 14px; border-radius: 10px; font-size: 14px; max-width: 85%; }
        .u { background: #10a37f; color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
        .a { background: #f3f4f6; color: #1f2937; align-self: flex-start; border-bottom-left-radius: 2px; border: 1px solid #e5e7eb; }
        .input-box { display: flex; padding: 15px; background: white; border-top: 1px solid #eee; }
        input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 8px; outline: none; }
        button { margin-left: 8px; padding: 10px 18px; background: #10a37f; color: white; border: none; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>

<div class="chat-wrap">
    <div class="header">AI Assistant</div>
    <div id="chatBox">
        <div class="m a">Salom! Men tayyorman. Savolingizni yozing.</div>
    </div>
    <div class="input-box">
        <input type="text" id="userInput" placeholder="Savol yozing...">
        <button id="sendBtn">Yuborish</button>
    </div>
</div>

<script>
    const HF_TOKEN = "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";

    async function chat() {
        const input = document.getElementById('userInput');
        const box = document.getElementById('chatBox');
        const text = input.value.trim();
        
        if (!text) return;

        // Foydalanuvchi xabari
        addMessage(text, 'u');
        input.value = "";

        const load = addMessage("O'ylayapman...", 'a');

        try {
            const response = await fetch("https://api-inference.huggingface.co/models/Mistralai/Mistral-7B-Instruct-v0.2", {
                method: "POST",
                headers: {
                    "Authorization": `Bearer ${HF_TOKEN}`,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ 
                    inputs: `<s>[INST] ${text} [/INST]`,
                    parameters: { max_new_tokens: 500 }
                })
            });

            const data = await response.json();
            load.remove();

            if (data && data[0] && data[0].generated_text) {
                let reply = data[0].generated_text.split('[/INST]').pop().trim();
                addMessage(reply, 'a');
            } else {
                addMessage("Xato: Model javob bermadi. Birozdan so'ng qayta urinib ko'ring.", 'a');
            }
        } catch (e) {
            if(load) load.remove();
            addMessage("Xato: Tarmoq bilan muammo yuzaga keldi.", 'a');
        }
    }

    function addMessage(t, type) {
        const d = document.createElement('div');
        d.className = `m ${type}`;
        d.innerText = t;
        const b = document.getElementById('chatBox');
        b.appendChild(d);
        b.scrollTop = b.scrollHeight;
        return d;
    }

    document.getElementById('sendBtn').onclick = chat;
    document.getElementById('userInput').onkeypress = (e) => { if(e.key === 'Enter') chat(); };
</script>

</body>
</html>
