<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini AI Assistant</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .chat-wrap { width: 100%; max-width: 450px; height: 80vh; background: white; border-radius: 20px; display: flex; flex-direction: column; box-shadow: 0 10px 30px rgba(0,0,0,0.1); overflow: hidden; margin: 10px; }
        .header { background: #1a73e8; color: white; padding: 20px; text-align: center; font-weight: bold; font-size: 20px; }
        #chatBox { flex: 1; padding: 20px; overflow-y: auto; background: #ffffff; display: flex; flex-direction: column; gap: 12px; }
        .m { padding: 12px 16px; border-radius: 15px; font-size: 15px; max-width: 85%; line-height: 1.4; word-wrap: break-word; }
        .u { background: #1a73e8; color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
        .a { background: #f1f3f4; color: #202124; align-self: flex-start; border-bottom-left-radius: 4px; }
        .input-box { display: flex; padding: 20px; background: white; border-top: 1px solid #eee; }
        input { flex: 1; padding: 12px; border: 1px solid #dfe1e5; border-radius: 24px; outline: none; font-size: 15px; }
        button { margin-left: 10px; padding: 12px 20px; background: #1a73e8; color: white; border: none; border-radius: 24px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        button:hover { background: #1557b0; }
    </style>
</head>
<body>

<div class="chat-wrap">
    <div class="header">Gemini AI</div>
    <div id="chatBox">
        <div class="m a">Salom! Men Google Gemini AI yordamchisiman. Qanday yordam bera olaman?</div>
    </div>
    <div class="input-box">
        <input type="text" id="userInput" placeholder="Xabar yozing...">
        <button id="sendBtn">Yuborish</button>
    </div>
</div>

<script>
    // Siz bergan API Key
    const API_KEY = "AIzaSyBlsfnAEGCfKjs8PI5F2MTvfwR55Nbj7_k"; 

    async function chat() {
        const input = document.getElementById('userInput');
        const text = input.value.trim();
        if (!text) return;

        addMessage(text, 'u');
        input.value = "";

        const load = addMessage("O'ylayapman...", 'a');

        try {
            // Google Gemini API endpoint
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: text }] }]
                })
            });

            const data = await response.json();
            load.remove();

            if (data.candidates && data.candidates[0].content.parts[0].text) {
                let reply = data.candidates[0].content.parts[0].text;
                addMessage(reply, 'a');
            } else {
                addMessage("Kechirasiz, javob olishda xatolik yuz berdi.", 'a');
                console.error("API Error:", data);
            }
        } catch (e) {
            if(load) load.remove();
            addMessage("Tarmoq xatosi! Internetni tekshiring.", 'a');
        }
    }

    function addMessage(t, type) {
        const d = document.createElement('div');
        d.className = `m ${type}`;
        d.innerText = t;
        const b = document.getElementById('chatBox');
        b.appendChild(d);
        b.scrollTop = b.scrollHeight;
        return d;
    }

    document.getElementById('sendBtn').onclick = chat;
    document.getElementById('userInput').onkeypress = (e) => { if(e.key === 'Enter') chat(); };
</script>

</body>
</html>
